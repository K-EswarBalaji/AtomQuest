databases:
  - name: goalquest-db
    databaseName: goalquest_db
    user: goalquest_user

services:
  - type: web
    name: goalquest-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goalquest-db
          property: connectionString
      - key: FRONTEND_URL
        # Set this to your deployed frontend domain (e.g. https://your-app.vercel.app)
        value: https://<your-frontend-domain>
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: LOG_LEVEL
        value: info

  - type: web
    name: goalquest-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        # Set this to your backend API URL (e.g. https://your-backend.onrender.com/api)
        value: https://<your-backend-domain>/api
      - key: REACT_APP_ENV
        value: production
