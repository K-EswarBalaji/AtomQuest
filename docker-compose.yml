version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goalquest-db
    environment:
      POSTGRES_USER: goalquest_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: goalquest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalquest_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalquest-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_USER: goalquest_user
      DB_PASSWORD: secure_password_123
      DB_NAME: goalquest_db
      DB_PORT: 5432
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goalquest-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  default:
    name: goalquest-network
